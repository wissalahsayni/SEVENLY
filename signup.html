<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SEVENLY — Sign Up</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;700;900&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    width: 100%;
    height: 100%;
    background: #1a0a2e;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Manrope', sans-serif;
    overflow: hidden;
  }

  .frame {
    width: 430px;
    height: 932px;
    background: #0a0510;
    border-radius: 40px;
    position: relative;
    overflow: hidden;
    box-shadow: 0 0 0 2px rgba(139,59,255,0.2), 0 30px 80px rgba(0,0,0,0.6);
    flex-shrink: 0;
    transform: scale(1);
  }

  @media (max-height: 1000px) { .frame { transform: scale(0.85); } }
  @media (max-height: 900px) { .frame { transform: scale(0.75); } }
  @media (max-height: 800px) { .frame { transform: scale(0.65); } }
  @media (max-height: 700px) { .frame { transform: scale(0.55); } }
  @media (max-height: 600px) { .frame { transform: scale(0.45); } }
  @media (max-height: 500px) { .frame { transform: scale(0.35); } }

  @media (max-width: 480px) {
    .frame {
      width: 100vw;
      height: 100vh;
      border-radius: 0;
      transform: none !important;
    }
  }

  .status-bar {
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    display: flex;
    justify-content: space-between;
    padding: 14px 28px 0;
    font-size: 15px;
    font-weight: 700;
    color: rgba(255,255,255,0.9);
    z-index: 5;
  }

  .signup-page {
    width: 100%;
    height: 100%;
    display: flex;
    flex-direction: column;
    padding: 55px 24px 30px;
    background: radial-gradient(ellipse at 50% 20%, #1a1035 0%, #0a0510 70%);
    overflow: hidden;
  }

  .signup-header { 
    margin-bottom: 16px;
    text-align: center;
  }
  .signup-header h1 {
    font-family: 'Fraunces', serif;
    font-weight: 700;
    font-size: 28px;
    color: #f5f2fa;
    line-height: 1.2;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
  }
  .signup-header .logo-img {
    width: 200px;
    height: auto;
    display: block;
    margin: 0 auto;
  }
  .signup-header p {
    color: rgba(169, 159, 192, 0.6);
    font-size: 14px;
    margin-top: 6px;
  }

  .signup-form {
    flex: 1;
    display: flex;
    flex-direction: column;
    gap: 10px;
    justify-content: center;
  }

  .input-group { display: flex; flex-direction: column; gap: 4px; }
  .input-group label {
    font-size: 11px;
    font-weight: 600;
    color: rgba(169, 159, 192, 0.7);
    letter-spacing: 0.05em;
    text-transform: uppercase;
  }
  .input-group input {
    background: rgba(31, 26, 46, 0.8);
    border: 1px solid rgba(255,255,255,0.06);
    border-radius: 12px;
    padding: 11px 16px;
    color: #f5f2fa;
    font-size: 14px;
    font-family: 'Manrope', sans-serif;
    outline: none;
    transition: border-color 0.2s ease;
  }
  .input-group input:focus { border-color: #8b3bff; }
  .input-group input::placeholder { color: rgba(110, 100, 128, 0.5); }

  .btn {
    padding: 14px;
    border: none;
    border-radius: 12px;
    font-size: 15px;
    font-weight: 700;
    font-family: 'Manrope', sans-serif;
    cursor: pointer;
    transition: transform 0.15s ease;
  }
  .btn:active { transform: scale(0.97); }
  .btn-primary {
    background: linear-gradient(135deg, #8b3bff, #5f1fc4);
    color: white;
    box-shadow: 0 4px 20px rgba(139,59,255,0.3);
    margin-top: 4px;
  }

  .auth-divider {
    display: flex;
    align-items: center;
    gap: 14px;
    color: rgba(110, 100, 128, 0.4);
    font-size: 11px;
    margin: 2px 0;
  }
  .auth-divider::before,
  .auth-divider::after {
    content: '';
    flex: 1;
    height: 1px;
    background: rgba(255,255,255,0.06);
  }

  .social-buttons { display: flex; gap: 10px; }
  .social-buttons .btn {
    flex: 1;
    padding: 10px;
    font-size: 13px;
    background: rgba(31, 26, 46, 0.6);
    border: 1px solid rgba(255,255,255,0.06);
    color: #f5f2fa;
  }

  .auth-footer {
    text-align: center;
    margin-top: 8px;
    font-size: 13px;
    color: rgba(169, 159, 192, 0.6);
  }
  .auth-footer a {
    color: #a877ff;
    text-decoration: none;
    font-weight: 700;
    cursor: pointer;
  }
  .auth-footer a:hover { text-decoration: underline; }
</style>
</head>
<body>

<div class="frame">
  <div class="status-bar">
    <span>9:41</span>
    <span>●●●●○ WiFi 🔋</span>
  </div>

  <div class="signup-page">
    <div class="signup-header">
      <h1>
        Join
        <img src="images/app logo.png" alt="SEVENLY" class="logo-img">
      </h1>
      <p>Create your ARMY profile</p>
    </div>

    <div class="signup-form">
      <div class="input-group">
        <label>Full Name</label>
        <input type="text" placeholder="Kim Namjoon">
      </div>
      <div class="input-group">
        <label>Username</label>
        <input type="text" placeholder="@army_forever">
      </div>
      <div class="input-group">
        <label>Email Address</label>
        <input type="email" placeholder="army@bts.com">
      </div>
      <div class="input-group">
        <label>Password</label>
        <input type="password" placeholder="••••••••">
      </div>
      <div class="input-group">
        <label>Date of Birth</label>
        <input type="text" placeholder="MM/DD/YYYY">
      </div>

      <div style="display:flex;align-items:center;gap:8px;margin:2px 0;">
        <input type="checkbox" id="terms" style="accent-color:#8b3bff;width:16px;height:16px;">
        <label for="terms" style="font-size:11px;color:rgba(169,159,192,0.6);">
          I agree to SEVENLY's <a href="#" style="color:#a877ff;text-decoration:none;">Terms of Service</a> and <a href="#" style="color:#a877ff;text-decoration:none;">Privacy Policy</a>
        </label>
      </div>

      <!-- CONNECTED TO HOME PAGE -->
      <button class="btn btn-primary" onclick="window.location.href='home.html'">Create My Account</button>

      <div class="auth-divider">or continue with</div>

      <div class="social-buttons">
        <button class="btn">🍎 Apple</button>
        <button class="btn">G Google</button>
      </div>

      <div class="auth-footer">
        Already have an account? <a onclick="window.location.href='login.html'">Sign In</a>
      </div>
    </div>
  </div>
</div>

</body>
</html>
