<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>SEVENLY — Story</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;700;900&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    width: 100%;
    height: 100%;
    background: #000;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Manrope', sans-serif;
    overflow: hidden;
  }

  .frame {
    width: 430px;
    height: 932px;
    background: #000;
    border-radius: 40px;
    position: relative;
    overflow: hidden;
    box-shadow: 0 0 0 2px rgba(139,59,255,0.2), 0 30px 80px rgba(0,0,0,0.6);
    flex-shrink: 0;
    transform: scale(1);
  }

  @media (max-height: 1000px) { .frame { transform: scale(0.85); } }
  @media (max-height: 900px) { .frame { transform: scale(0.75); } }
  @media (max-height: 800px) { .frame { transform: scale(0.65); } }
  @media (max-height: 700px) { .frame { transform: scale(0.55); } }
  @media (max-height: 600px) { .frame { transform: scale(0.45); } }
  @media (max-height: 500px) { .frame { transform: scale(0.35); } }

  @media (max-width: 480px) {
    .frame {
      width: 100vw;
      height: 100vh;
      border-radius: 0;
      transform: none !important;
    }
  }

  .status-bar {
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    display: flex;
    justify-content: space-between;
    padding: 14px 28px 0;
    font-size: 15px;
    font-weight: 700;
    color: rgba(255,255,255,0.9);
    z-index: 5;
  }

  .story-viewer {
    width: 100%;
    height: 100%;
    position: relative;
    background: #000;
  }

  .story-bg {
    width: 100%;
    height: 100%;
    object-fit: cover;
    position: absolute;
    top: 0;
    left: 0;
  }

  .story-gradient {
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    background: linear-gradient(to bottom, rgba(0,0,0,0.4) 0%, transparent 40%, transparent 60%, rgba(0,0,0,0.6) 100%);
    pointer-events: none;
  }

  .story-progress {
    position: absolute;
    top: 44px;
    left: 12px;
    right: 12px;
    display: flex;
    gap: 4px;
    z-index: 10;
  }

  .story-progress .segment {
    flex: 1;
    height: 3px;
    background: rgba(255,255,255,0.25);
    border-radius: 3px;
    overflow: hidden;
  }

  .story-progress .segment .fill {
    height: 100%;
    background: white;
    border-radius: 3px;
    width: 0%;
    transition: width 0.1s linear;
  }

  .story-progress .segment .fill.active {
    width: 100% !important;
  }

  .story-top {
    position: absolute;
    top: 56px;
    left: 16px;
    right: 16px;
    display: flex;
    align-items: center;
    gap: 10px;
    z-index: 10;
  }

  .story-top .avatar {
    width: 32px;
    height: 32px;
    border-radius: 50%;
    background: linear-gradient(135deg, #8b3bff, #f5c451);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 2px;
    flex-shrink: 0;
  }

  .story-top .avatar .inner {
    width: 100%;
    height: 100%;
    border-radius: 50%;
    background: #1a1035;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 14px;
    border: 2px solid #000;
  }

  .story-top .info {
    flex: 1;
  }

  .story-top .info .name {
    color: white;
    font-weight: 700;
    font-size: 14px;
  }

  .story-top .info .time {
    color: rgba(255,255,255,0.6);
    font-size: 11px;
  }

  .story-top .more-btn {
    color: white;
    font-size: 18px;
    cursor: pointer;
    background: none;
    border: none;
    opacity: 0.7;
    padding: 4px;
  }

  .story-text-content {
    position: absolute;
    bottom: 160px;
    left: 20px;
    right: 20px;
    z-index: 5;
  }

  .story-text-content .story-emoji {
    font-size: 64px;
    display: block;
    margin-bottom: 8px;
  }

  .story-text-content p {
    color: white;
    font-size: 20px;
    font-weight: 600;
    text-shadow: 0 2px 10px rgba(0,0,0,0.5);
    line-height: 1.4;
  }

  .story-text-content p .highlight {
    background: linear-gradient(135deg, #8b3bff, #f5c451);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }

  .story-actions {
    position: absolute;
    bottom: 40px;
    left: 16px;
    right: 16px;
    display: flex;
    align-items: center;
    gap: 10px;
    z-index: 10;
  }

  .story-actions input {
    flex: 1;
    padding: 10px 16px;
    border-radius: 20px;
    background: rgba(255,255,255,0.12);
    backdrop-filter: blur(10px);
    border: 1px solid rgba(255,255,255,0.08);
    color: white;
    font-size: 14px;
    font-family: 'Manrope', sans-serif;
    outline: none;
  }
  .story-actions input::placeholder {
    color: rgba(255,255,255,0.5);
  }

  .story-actions .action-btn {
    width: 40px;
    height: 40px;
    border-radius: 50%;
    border: none;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 18px;
    transition: transform 0.2s;
    background: rgba(255,255,255,0.1);
    backdrop-filter: blur(10px);
    color: white;
    flex-shrink: 0;
  }
  .story-actions .action-btn:active { transform: scale(0.9); }

  .story-actions .action-btn.like.liked {
    background: rgba(255,107,107,0.3);
  }

  .tap-zone {
    position: absolute;
    top: 0;
    bottom: 0;
    width: 30%;
    z-index: 4;
    cursor: pointer;
  }
  .tap-zone.left { left: 0; }
  .tap-zone.right { right: 0; }

  .story-close {
    position: absolute;
    top: 12px;
    right: 16px;
    z-index: 20;
    color: white;
    font-size: 28px;
    cursor: pointer;
    background: none;
    border: none;
    opacity: 0.8;
  }
</style>
</head>
<body>

<div class="frame">
  <div class="status-bar">
    <span>9:41</span>
    <span>●●●●○ WiFi 🔋</span>
  </div>

  <div class="story-viewer" id="storyViewer">
    <img src="https://images.unsplash.com/photo-1519681393784-d120267933ba?w=800" alt="Story" class="story-bg" id="storyBg">
    <div class="story-gradient"></div>

    <button class="story-close" onclick="window.location.href='home.html'">✕</button>

    <div class="story-progress" id="progressBar">
      <div class="segment"><div class="fill active" id="seg1"></div></div>
      <div class="segment"><div class="fill" id="seg2"></div></div>
      <div class="segment"><div class="fill" id="seg3"></div></div>
      <div class="segment"><div class="fill" id="seg4"></div></div>
      <div class="segment"><div class="fill" id="seg5"></div></div>
    </div>

    <div class="story-top">
      <div class="avatar"><div class="inner">💜</div></div>
      <div class="info">
        <div class="name" id="storyName">purpleheart_92</div>
        <div class="time" id="storyTime">2m ago</div>
      </div>
      <button class="more-btn">•••</button>
    </div>

    <div class="story-text-content">
      <span class="story-emoji" id="storyEmoji">💜</span>
      <p id="storyText">
        BTS just dropped hints about their next comeback! 🎉<br>
        <span class="highlight">This is NOT a drill ARMY!!</span>
      </p>
    </div>

    <div class="story-actions">
      <input type="text" placeholder="Send message... 💜">
      <button class="action-btn like" id="likeBtn" onclick="toggleLike()">❤️</button>
      <button class="action-btn">✉️</button>
    </div>

    <div class="tap-zone left" onclick="prevStory()"></div>
    <div class="tap-zone right" onclick="nextStory()"></div>
  </div>
</div>

<script>
  const urlParams = new URLSearchParams(window.location.search);
  const storyId = parseInt(urlParams.get('story')) || 0;

  let currentStory = storyId;
  let isLiked = false;
  let progressInterval;

  const stories = [
    {
      image: 'https://images.unsplash.com/photo-1519681393784-d120267933ba?w=800',
      emoji: '💜',
      text: 'BTS just dropped hints about their next comeback! 🎉\nThis is NOT a drill ARMY!!',
      name: 'BTS Official',
      time: '2m ago'
    },
    {
      image: 'https://images.unsplash.com/photo-1517245386807-bb43f82c33c4?w=800',
      emoji: '🌟',
      text: 'Day 7 of learning Korean! 🇰🇷\n방탄소년단은 내 삶이에요',
      name: 'ARMY Cofe',
      time: '15m ago'
    },
    {
      image: 'https://images.unsplash.com/photo-1504384308090-c894fdcc538d?w=800',
      emoji: '🌸',
      text: 'The purple ocean from the stage\nwas breathtaking 😭💜',
      name: 'Purple Ocean',
      time: '1h ago'
    },
    {
      image: 'https://images.unsplash.com/photo-1529626455594-4ff0802cfb7e?w=800',
      emoji: '🌊',
      text: '7 years of beautiful moments\ncompiled into one video 💜',
      name: 'Bangtan Letters',
      time: '2h ago'
    },
    {
      image: 'https://images.unsplash.com/photo-1519741497674-611481863552?w=800',
      emoji: '🔥',
      text: 'BTS Universe is growing every day!\nWe are all connected 💜',
      name: 'BTS Universe',
      time: '3h ago'
    },
    {
      image: 'https://images.unsplash.com/photo-1518635013498-2aeedc3a1f70?w=800',
      emoji: '🌌',
      text: 'The purple ocean from the concert\nwas absolutely breathtaking! 💜',
      name: 'btsnation_br',
      time: '4h ago'
    }
  ];

  function loadStory(index) {
    const story = stories[index];
    if (!story) return;

    document.getElementById('storyBg').src = story.image;
    document.getElementById('storyEmoji').textContent = story.emoji;
    document.getElementById('storyText').innerHTML = story.text.replace(/\n/g, '<br>');
    document.getElementById('storyName').textContent = story.name;
    document.getElementById('storyTime').textContent = story.time;

    const segments = document.querySelectorAll('.segment .fill');
    segments.forEach((seg, i) => {
      seg.style.width = i === 0 ? '0%' : '0%';
      seg.classList.remove('active');
    });

    startProgress();
  }

  function startProgress() {
    const segments = document.querySelectorAll('.segment .fill');
    let currentSeg = 0;
    let progress = 0;

    if (progressInterval) clearInterval(progressInterval);

    progressInterval = setInterval(() => {
      progress += 1.2;
      if (progress <= 100) {
        segments[currentSeg].style.width = progress + '%';
      } else {
        currentSeg++;
        progress = 0;
        if (currentSeg >= segments.length) {
          clearInterval(progressInterval);
          setTimeout(() => nextStory(), 300);
          return;
        }
        segments[currentSeg].style.width = '0%';
      }
    }, 40);
  }

  function nextStory() {
    if (progressInterval) clearInterval(progressInterval);
    currentStory = (currentStory + 1) % stories.length;
    loadStory(currentStory);
  }

  function prevStory() {
    if (progressInterval) clearInterval(progressInterval);
    currentStory = (currentStory - 1 + stories.length) % stories.length;
    loadStory(currentStory);
  }

  function toggleLike() {
    const btn = document.getElementById('likeBtn');
    isLiked = !isLiked;
    if (isLiked) {
      btn.classList.add('liked');
      btn.textContent = '❤️';
    } else {
      btn.classList.remove('liked');
      btn.textContent = '🤍';
    }
  }

  loadStory(currentStory);
</script>

</body>
</html>
