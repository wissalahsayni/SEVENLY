<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SEVENLY — Splash</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;700;900&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    width: 100%;
    height: 100%;
    background: #1a0a2e;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Manrope', sans-serif;
    overflow: hidden;
  }

  .frame {
    width: 430px;
    height: 932px;
    background: #0a0510;
    border-radius: 40px;
    position: relative;
    overflow: hidden;
    box-shadow: 0 0 0 2px rgba(139,59,255,0.2), 0 30px 80px rgba(0,0,0,0.6);
    flex-shrink: 0;
    transform: scale(1);
  }

  @media (max-height: 1000px) { .frame { transform: scale(0.85); } }
  @media (max-height: 900px) { .frame { transform: scale(0.75); } }
  @media (max-height: 800px) { .frame { transform: scale(0.65); } }
  @media (max-height: 700px) { .frame { transform: scale(0.55); } }
  @media (max-height: 600px) { .frame { transform: scale(0.45); } }
  @media (max-height: 500px) { .frame { transform: scale(0.35); } }

  @media (max-width: 480px) {
    .frame {
      width: 100vw;
      height: 100vh;
      border-radius: 0;
      transform: none !important;
    }
  }

  .status-bar {
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    display: flex;
    justify-content: space-between;
    padding: 14px 28px 0;
    font-size: 15px;
    font-weight: 700;
    color: rgba(255,255,255,0.9);
    z-index: 5;
  }

  .splash {
    width: 100%;
    height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: radial-gradient(ellipse at 50% 25%, #1a1035 0%, #0a0510 70%);
    position: relative;
    padding: 40px 30px;
    transition: opacity 0.8s ease, transform 0.8s ease;
  }

  .splash.hide {
    opacity: 0;
    transform: scale(1.1);
    pointer-events: none;
  }

  .glow-orb {
    position: absolute;
    width: 350px;
    height: 350px;
    background: radial-gradient(circle, rgba(139,59,255,0.12) 0%, transparent 70%);
    border-radius: 50%;
    top: 10%;
    left: 50%;
    transform: translateX(-50%);
    animation: pulseGlow 3.5s ease-in-out infinite;
  }

  .glow-orb-2 {
    position: absolute;
    width: 200px;
    height: 200px;
    background: radial-gradient(circle, rgba(245,196,81,0.06) 0%, transparent 70%);
    border-radius: 50%;
    bottom: 15%;
    right: 5%;
    animation: pulseGlow2 4s ease-in-out infinite 1s;
  }

  @keyframes pulseGlow {
    0%, 100% { opacity: 0.4; transform: translateX(-50%) scale(1); }
    50% { opacity: 1; transform: translateX(-50%) scale(1.2); }
  }

  @keyframes pulseGlow2 {
    0%, 100% { opacity: 0.2; transform: scale(1); }
    50% { opacity: 0.6; transform: scale(1.5); }
  }

  .spark {
    position: absolute;
    width: 5px;
    height: 5px;
    background: #f5c451;
    border-radius: 50%;
    box-shadow: 0 0 15px #f5c451, 0 0 30px rgba(245,196,81,0.3);
    animation: sparkle 2.5s ease-in-out infinite;
  }

  .spark:nth-child(3) { animation-delay: 0.2s; top: 12%; left: 12%; }
  .spark:nth-child(4) { animation-delay: 0.6s; top: 68%; left: 88%; }
  .spark:nth-child(5) { animation-delay: 1s; top: 82%; left: 8%; }
  .spark:nth-child(6) { animation-delay: 1.4s; top: 22%; left: 90%; }
  .spark:nth-child(7) { animation-delay: 0.8s; top: 55%; left: 3%; }
  .spark:nth-child(8) { animation-delay: 1.8s; top: 45%; left: 95%; }

  @keyframes sparkle {
    0%, 100% { opacity: 0; transform: scale(0); }
    50% { opacity: 1; transform: scale(1); }
  }

  /* ===== LOGO CONTAINER ===== */
  .logo-container {
    position: relative;
    z-index: 2;
    text-align: center;
    animation: float 3.4s ease-in-out infinite;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 12px;
    margin-top: -40px;
  }

  @keyframes float {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-10px); }
  }

  .logo-container .icon-img {
    width: 115px;
    height: auto;
    display: block;
    margin: 0 auto;
    filter: drop-shadow(0 0 40px rgba(139,59,255,0.3));
  }

  .logo-container .name-img {
    width: 300px;
    height: auto;
    display: block;
    margin: 0 auto;
    filter: drop-shadow(0 0 40px rgba(139,59,255,0.3));
  }

  .logo-container .slogan-img {
    width: 240px;
    height: auto;
    display: block;
    margin: 0 auto;
  }

  /* ===== LOADING SECTION - BOTTOM ===== */
  .loading-section {
    position: absolute;
    bottom: 80px;
    left: 0;
    right: 0;
    z-index: 2;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 16px;
  }

  .dots {
    display: flex;
    gap: 9px;
  }

  .dots span {
    width: 8px;
    height: 8px;
    background: #8b3bff;
    border-radius: 50%;
    animation: dotBounce 1.4s ease-in-out infinite;
    box-shadow: 0 0 20px rgba(139,59,255,0.3);
  }

  .dots span:nth-child(2) { animation-delay: 0.2s; }
  .dots span:nth-child(3) { animation-delay: 0.4s; }

  @keyframes dotBounce {
    0%, 80%, 100% { transform: scale(0.3); opacity: 0.3; }
    40% { transform: scale(1); opacity: 1; }
  }

  .loading-text {
    font-size: 12px;
    color: rgba(110, 100, 128, 0.7);
    letter-spacing: 0.08em;
    animation: pulseText 2s ease-in-out infinite;
  }

  @keyframes pulseText {
    0%, 100% { opacity: 0.4; }
    50% { opacity: 1; }
  }

  .version {
    position: absolute;
    bottom: 34px;
    z-index: 2;
    font-size: 11px;
    color: rgba(110, 100, 128, 0.3);
    letter-spacing: 0.1em;
    left: 0;
    right: 0;
    text-align: center;
  }

  .transition-overlay {
    position: fixed;
    inset: 0;
    background: #1a0a2e;
    z-index: 999;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.6s ease;
  }

  .transition-overlay.active {
    opacity: 1;
    pointer-events: all;
  }
</style>
</head>
<body>

<div class="transition-overlay" id="transitionOverlay"></div>

<div class="frame">
  <div class="status-bar">
    <span>9:41</span>
    <span>●●●●○ WiFi 🔋</span>
  </div>

  <div class="splash" id="splash">
    <div class="glow-orb"></div>
    <div class="glow-orb-2"></div>
    <div class="spark"></div>
    <div class="spark"></div>
    <div class="spark"></div>
    <div class="spark"></div>
    <div class="spark"></div>
    <div class="spark"></div>

    <!-- Logo: Icon + Name + Slogan (centered) -->
    <div class="logo-container">
      <img src="images/icon.png" alt="SEVENLY Icon" class="icon-img">
      <img src="images/name.png" alt="SEVENLY" class="name-img">
      <img src="images/solgan.png" alt="Seven Galaxies. One Universe." class="slogan-img">
    </div>

    <!-- Loading Section (at the bottom) -->
    <div class="loading-section">
      <div class="dots">
        <span></span><span></span><span></span>
      </div>
      <div class="loading-text">Loading your universe...</div>
    </div>

    <div class="version">V0.1</div>
  </div>
</div>

<script>
  document.addEventListener('DOMContentLoaded', () => {
    const splash = document.getElementById('splash');
    const overlay = document.getElementById('transitionOverlay');

    setTimeout(() => {
      splash.classList.add('hide');
      setTimeout(() => {
        overlay.classList.add('active');
        setTimeout(() => {
          window.location.href = 'getstarted.html';
        }, 600);
      }, 400);
    }, 2000);
  });
</script>

</body>
</html>
