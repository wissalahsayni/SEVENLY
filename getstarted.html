<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SEVENLY — Get Started</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;700;900&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    width: 100%;
    height: 100%;
    background: #1a0a2e;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Manrope', sans-serif;
    overflow: hidden;
  }

  .frame {
    width: 430px;
    height: 932px;
    background: #0a0510;
    border-radius: 40px;
    position: relative;
    overflow: hidden;
    box-shadow: 0 0 0 2px rgba(139,59,255,0.2), 0 30px 80px rgba(0,0,0,0.6);
    flex-shrink: 0;
    transform: scale(1);
  }

  @media (max-height: 1000px) { .frame { transform: scale(0.85); } }
  @media (max-height: 900px) { .frame { transform: scale(0.75); } }
  @media (max-height: 800px) { .frame { transform: scale(0.65); } }
  @media (max-height: 700px) { .frame { transform: scale(0.55); } }
  @media (max-height: 600px) { .frame { transform: scale(0.45); } }
  @media (max-height: 500px) { .frame { transform: scale(0.35); } }

  @media (max-width: 480px) {
    .frame {
      width: 100vw;
      height: 100vh;
      border-radius: 0;
      transform: none !important;
    }
  }

  .status-bar {
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    display: flex;
    justify-content: space-between;
    padding: 14px 28px 0;
    font-size: 15px;
    font-weight: 700;
    color: rgba(255,255,255,0.9);
    z-index: 5;
  }

  .get-started-page {
    width: 100%;
    height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: radial-gradient(ellipse at 50% 20%, #1a1035 0%, #0a0510 70%);
    padding: 40px 30px;
  }

  .get-started-header {
    text-align: center;
    margin-bottom: 40px;
  }

  .get-started-header h1 {
    font-family: 'Fraunces', serif;
    font-weight: 700;
    font-size: 34px;
    color: #f5f2fa;
    line-height: 1.2;
  }
  .get-started-header h1 span {
    background: linear-gradient(135deg, #a877ff, #f5c451);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  .get-started-header p {
    color: rgba(169, 159, 192, 0.6);
    font-size: 15px;
    margin-top: 6px;
  }

  .get-started-buttons {
    display: flex;
    flex-direction: column;
    gap: 14px;
    width: 100%;
    max-width: 340px;
  }

  .btn {
    padding: 16px;
    border: none;
    border-radius: 14px;
    font-size: 16px;
    font-weight: 700;
    font-family: 'Manrope', sans-serif;
    cursor: pointer;
    transition: transform 0.15s ease, box-shadow 0.2s ease;
    width: 100%;
  }
  .btn:active { transform: scale(0.97); }

  .btn-primary {
    background: linear-gradient(135deg, #8b3bff, #5f1fc4);
    color: white;
    box-shadow: 0 4px 20px rgba(139,59,255,0.3);
  }
  .btn-primary:hover {
    box-shadow: 0 4px 30px rgba(139,59,255,0.5);
  }

  .btn-secondary {
    background: rgba(31, 26, 46, 0.8);
    color: #f5f2fa;
    border: 1px solid rgba(255,255,255,0.08);
  }
  .btn-secondary:hover {
    background: rgba(31, 26, 46, 1);
    border-color: rgba(139,59,255,0.3);
  }

  .get-started-footer {
    text-align: center;
    margin-top: 30px;
    font-size: 12px;
    color: rgba(169, 159, 192, 0.3);
    letter-spacing: 0.05em;
  }
</style>
</head>
<body>

<div class="frame">
  <div class="status-bar">
    <span>9:41</span>
    <span>●●●●○ WiFi 🔋</span>
  </div>

  <div class="get-started-page">
    <div class="get-started-header">
      <h1>Welcome to <img src="images/name.png"></h1>
      <p>Seven Galaxies, One Universe</p>
      
    </div>

    <div class="get-started-buttons">
      <button class="btn btn-primary" onclick="window.location.href='signup.html'">
        🚀 Get Started — It's Free
      </button>
      <button class="btn btn-secondary" onclick="window.location.href='login.html'">
        👤 I Already Have an Account
      </button>
    </div>

    <div class="get-started-footer">FOR ARMY • BY ARMY</div>
  </div>
</div>

</body>
</html>
