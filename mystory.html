<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>SEVENLY — New Story</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;700;900&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    width: 100%;
    height: 100%;
    background: #1a0a2e;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Manrope', sans-serif;
    overflow: hidden;
  }

  .frame {
    width: 430px;
    height: 932px;
    background: #000;
    border-radius: 40px;
    position: relative;
    overflow: hidden;
    box-shadow: 0 0 0 2px rgba(139,59,255,0.2), 0 30px 80px rgba(0,0,0,0.6);
    flex-shrink: 0;
    transform: scale(1);
  }

  @media (max-height: 1000px) { .frame { transform: scale(0.85); } }
  @media (max-height: 900px) { .frame { transform: scale(0.75); } }
  @media (max-height: 800px) { .frame { transform: scale(0.65); } }
  @media (max-height: 700px) { .frame { transform: scale(0.55); } }
  @media (max-height: 600px) { .frame { transform: scale(0.45); } }
  @media (max-height: 500px) { .frame { transform: scale(0.35); } }

  @media (max-width: 480px) {
    .frame {
      width: 100vw;
      height: 100vh;
      border-radius: 0;
      transform: none !important;
    }
  }

  .status-bar {
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    display: flex;
    justify-content: space-between;
    padding: 14px 28px 0;
    font-size: 15px;
    font-weight: 700;
    color: rgba(255,255,255,0.9);
    z-index: 5;
  }

  .story-page {
    width: 100%;
    height: 100%;
    display: flex;
    flex-direction: column;
    background: #411971;
    position: relative;
  }

  .story-top-bar {
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    padding: 55px 16px 16px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    z-index: 10;
    background: linear-gradient(to bottom, rgba(0,0,0,0.5) 0%, transparent 100%);
  }

  .story-top-bar .close-btn {
    color: white;
    font-size: 24px;
    cursor: pointer;
    background: none;
    border: none;
    font-family: 'Manrope', sans-serif;
    opacity: 0.8;
    transition: opacity 0.2s;
    padding: 8px;
  }
  .story-top-bar .close-btn:hover { opacity: 1; }

  .story-top-bar .story-title {
    color: white;
    font-weight: 700;
    font-size: 16px;
    letter-spacing: 0.5px;
  }

  .story-top-bar .next-btn {
    color: #a877ff;
    font-weight: 700;
    font-size: 15px;
    cursor: pointer;
    background: none;
    border: none;
    font-family: 'Manrope', sans-serif;
    opacity: 0.6;
    transition: opacity 0.2s;
    padding: 8px 16px;
    border-radius: 8px;
  }
  .story-top-bar .next-btn.active {
    opacity: 1;
  }

  .story-preview-area {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #000;
    position: relative;
  }

  .story-preview-area .preview-placeholder {
    text-align: center;
    color: rgba(255,255,255,0.3);
  }

  .story-preview-area .preview-placeholder .icon {
    font-size: 64px;
    margin-bottom: 12px;
    display: block;
  }

  .story-preview-area .preview-placeholder p {
    font-size: 14px;
  }

  .story-preview-area .preview-image {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: none;
  }

  .story-preview-area .preview-image.show {
    display: block;
  }

  .text-overlay {
    position: absolute;
    bottom: 100px;
    left: 20px;
    right: 20px;
    z-index: 10;
    display: none;
  }

  .text-overlay.show {
    display: block;
  }

  .text-overlay input {
    width: 100%;
    padding: 14px 18px;
    border-radius: 14px;
    background: rgba(0,0,0,0.6);
    border: 1px solid rgba(255,255,255,0.15);
    color: white;
    font-size: 18px;
    font-family: 'Manrope', sans-serif;
    outline: none;
    backdrop-filter: blur(10px);
    text-align: center;
  }
  .text-overlay input::placeholder {
    color: rgba(255,255,255,0.4);
    font-size: 16px;
  }
  .text-overlay input:focus {
    border-color: #a877ff;
  }

  .story-progress {
    position: absolute;
    bottom: 100px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    gap: 6px;
    z-index: 10;
  }

  .story-progress .dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: rgba(255,255,255,0.2);
    transition: background 0.3s;
  }
  .story-progress .dot.active {
    background: #a877ff;
  }

  .story-bottom-actions {
    position: absolute;
    bottom: 30px;
    left: 0;
    right: 0;
    padding: 0 20px;
    display: flex;
    gap: 16px;
    z-index: 10;
  }

  .story-bottom-actions .action-btn {
    flex: 1;
    padding: 14px;
    border-radius: 14px;
    font-size: 14px;
    font-weight: 700;
    font-family: 'Manrope', sans-serif;
    cursor: pointer;
    border: none;
    transition: transform 0.15s ease;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
  }
  .story-bottom-actions .action-btn:active { transform: scale(0.95); }

  .action-btn.gallery {
    background: rgba(255,255,255,0.12);
    color: white;
    backdrop-filter: blur(10px);
    border: 1px solid rgba(255,255,255,0.08);
  }

  .action-btn.camera {
    background: linear-gradient(135deg, #8b3bff, #5f1fc4);
    color: white;
    box-shadow: 0 4px 20px rgba(139,59,255,0.3);
  }

  .action-btn.text {
    background: rgba(255,255,255,0.08);
    color: white;
    backdrop-filter: blur(10px);
    border: 1px solid rgba(255,255,255,0.05);
  }

  #fileInput {
    display: none;
  }
</style>
</head>
<body>

<div class="frame">
  <div class="status-bar">
    <span>9:41</span>
    <span>●●●●○ WiFi 🔋</span>
  </div>

  <div class="story-page">
    <div class="story-top-bar">
      <!-- X Button - Goes back to Home -->
      <button class="close-btn" onclick="window.location.href='home.html'">✕</button>
      <span class="story-title">New Story</span>
      <button class="next-btn" id="nextBtn" disabled onclick="postStory()">Share</button>
    </div>

    <div class="story-preview-area" id="previewArea">
      <div class="preview-placeholder" id="placeholder">
        <span class="icon">📸</span>
        <p>Tap below to add a photo</p>
      </div>
      <img src="" alt="Story Preview" class="preview-image" id="previewImage">
    </div>

    <div class="text-overlay" id="textOverlay">
      <input type="text" id="captionInput" placeholder="Add text..." maxlength="100">
    </div>

    <div class="story-progress">
      <span class="dot active"></span>
      <span class="dot"></span>
      <span class="dot"></span>
    </div>

    <div class="story-bottom-actions">
      <button class="action-btn gallery" onclick="document.getElementById('fileInput').click()">
        🖼️ Gallery
      </button>
      <button class="action-btn camera" onclick="openCamera()">
        📷 Camera
      </button>
      <button class="action-btn text" onclick="toggleTextInput()">
        ✏️ Text
      </button>
    </div>

    <input type="file" id="fileInput" accept="image/*" onchange="previewFile(event)">
  </div>
</div>

<script>
  let selectedFile = null;

  function previewFile(event) {
    const file = event.target.files[0];
    if (file) {
      selectedFile = file;
      const reader = new FileReader();
      reader.onload = function(e) {
        const img = document.getElementById('previewImage');
        const placeholder = document.getElementById('placeholder');
        img.src = e.target.result;
        img.classList.add('show');
        placeholder.style.display = 'none';
        document.getElementById('nextBtn').disabled = false;
        document.getElementById('nextBtn').classList.add('active');
        document.getElementById('textOverlay').classList.remove('show');
      }
      reader.readAsDataURL(file);
    }
  }

  function openCamera() {
    alert('📷 Camera opening...\n(Simulated - please use Gallery for demo)');
    document.getElementById('fileInput').click();
  }

  function toggleTextInput() {
    const overlay = document.getElementById('textOverlay');
    const input = document.getElementById('captionInput');
    overlay.classList.toggle('show');
    if (overlay.classList.contains('show')) {
      input.focus();
    }
  }

  function postStory() {
    const caption = document.getElementById('captionInput').value;
    if (!selectedFile && !caption.trim()) {
      alert('Please add a photo or text to your story! 📸');
      return;
    }
    
    const btn = document.getElementById('nextBtn');
    btn.textContent = '✅ Shared!';
    btn.style.color = '#34d399';
    
    localStorage.setItem('hasStory', 'true');
    
    setTimeout(() => {
      window.location.href = 'home.html';
    }, 1200);
  }

  document.getElementById('captionInput').addEventListener('keydown', function(e) {
    if (e.key === 'Enter') {
      e.preventDefault();
      document.getElementById('textOverlay').classList.remove('show');
    }
  });
</script>

</body>
</html>
